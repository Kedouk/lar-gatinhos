<app-header></app-header>

<main>

  <section class="adoption-header">

    <h1>Gatinhos para adoção</h1>

    <p>
      Encontre um novo companheiro e transforme uma vida através da adoção.
    </p>

  </section>


  <section class="cats">

    <div class="filters">

      <select>
        <option value="">Todos os sexos</option>
        <option value="femea">Fêmea</option>
        <option value="macho">Macho</option>
      </select>

      <select>
        <option value="">Todas as idades</option>
        <option value="filhote">Filhote</option>
        <option value="adulto">Adulto</option>
        <option value="idoso">Idoso</option>
      </select>

    </div>


    <div class="cats-grid">

      <div class="cat-card">

        <div class="cat-image">
          <img src="gato-hero.png" alt="Foto do gatinho">
        </div>

        <div class="cat-info">

          <h2>Nome do gatinho</h2>

          <div class="cat-details">
            <span>Idade</span>
            <span>Sexo</span>
          </div>

          <p>
            Breve descrição do gatinho.
          </p>

          <a href="#" class="button">
            Quero conhecer
          </a>

        </div>

      </div>

    </div>

  </section>

</main>
